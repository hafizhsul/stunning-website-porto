<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Latar Belakang Gelap -->
  <rect width="100" height="100" rx="22" fill="#0f172a" />
  <!-- Kurung Siku Kiri -->
  <polyline points="35,30 15,50 35,70" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Kurung Siku Kanan -->
  <polyline points="65,30 85,50 65,70" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Garis Miring Tengah -->
  <line x1="60" y1="20" x2="40" y2="80" stroke="#e2e8f0" stroke-width="10" stroke-linecap="round" />
</svg>
